# Catppuccin Frappé   https://catppuccin.com/palette
#
#   crust    #232634   surface0 #414559   overlay1 #838ba7   mauve    #ca9ee6
#   mantle   #292c3c   surface1 #51576d   text     #c6d0f5   lavender #babbf1
#   base     #303446   overlay0 #737994   blue     #8caaee
#
# Bar on mantle, mauve accent, crust text on colored blocks. Same layout as
# ayu-mirage.conf, and it must set the same options (see the note there).
# Keep hex lowercase: in format strings an uppercase "#F.."/"#D.." is read
# as a format alias and mangles the color.
#
#  and  are the Nerd Font powerline arrows (right / left).

set -g status-style "bg=#292c3c,fg=#c6d0f5"

# left: session name in a mauve block, then a powerline arrow into the bar
set -g status-left "#[fg=#232634,bg=#ca9ee6,bold] #S #[fg=#ca9ee6,bg=#292c3c,nobold] "

# windows, inactive: muted text on bar bg
set -g window-status-style "fg=#838ba7,bg=#292c3c"
set -g window-status-format " #I #W "
set -g window-status-separator ""

# windows, active: surface block bracketed by powerline arrows
set -g window-status-current-format "#[fg=#292c3c,bg=#414559]#[fg=#ca9ee6,bg=#414559,bold] #I #W #[fg=#414559,bg=#292c3c]"

# right: autosave . hostname . date/time (left-pointing arrows, ending mauve)
set -g status-right "#[fg=#414559,bg=#292c3c]#[fg=#c6d0f5,bg=#414559] ⟳ #{@continuum-save-interval}m #[fg=#8caaee,bg=#414559]#[fg=#232634,bg=#8caaee,bold] #h #[fg=#ca9ee6,bg=#8caaee]#[fg=#232634,bg=#ca9ee6,bold] %a %b %d · %H:%M "

# pane borders
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#ca9ee6"

# messages / command prompt
set -g message-style "fg=#232634,bg=#ca9ee6,bold"
set -g message-command-style "fg=#c6d0f5,bg=#414559"

# copy-mode selection + clock
set -g mode-style "fg=#232634,bg=#babbf1"
set -g clock-mode-colour "#8caaee"

# menus (prefix + T theme picker, right-click menus)
set -g menu-style "fg=#c6d0f5,bg=#292c3c"
set -g menu-selected-style "fg=#232634,bg=#ca9ee6,bold"
set -g menu-border-style "fg=#51576d"
