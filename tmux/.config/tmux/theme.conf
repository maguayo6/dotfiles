# tmux theme built only from the terminal's palette, so tmux recolors itself
# whenever the terminal emulator's color scheme changes (no per-theme files).
#
# Rules that keep it working across palettes:
#   - Only ANSI color names (red..white, brightblack..brightwhite) and
#     `default`. Hex/colourNNN values bypass the terminal palette.
#   - Never use `black` as a color: in many palettes (e.g. Ayu Mirage) it is
#     the same as the background and disappears.
#   - Colored blocks are `fg=<accent>,bg=default,reverse`: the block becomes
#     the accent and its text becomes the terminal's background color, which
#     every palette keeps readable against its accents (dark and light).
#     Reset with `noreverse` before the arrow that leaves the block.
#   - `brightblack` is the palette's muted/comment gray.
#
#   and  are the Nerd Font powerline arrows (right / left).

# bar blends into the terminal background
set -g status-style "bg=default,fg=default"

# left: session name in a magenta block, then an arrow into the bar
set -g status-left "#[fg=magenta,bg=default,reverse,bold] #S #[fg=magenta,bg=default,noreverse,nobold] "

# windows, inactive: muted text
set -g window-status-style "fg=brightblack,bg=default"
set -g window-status-format " #I #W "
set -g window-status-separator ""

# windows, active: blue block bracketed by powerline arrows
set -g window-status-current-format "#[fg=blue,bg=default,reverse]#[bold] #I #W #[fg=blue,bg=default,noreverse,nobold]"

# right: autosave (muted) . hostname (blue block) . date/time (magenta block)
set -g status-right "#[fg=brightblack,bg=default] ⟳ #{@continuum-save-interval}m #[fg=blue,bg=default]#[fg=blue,bg=default,reverse,bold] #h #[fg=magenta,bg=blue,noreverse,nobold]#[fg=magenta,bg=default,reverse,bold] %a %b %d · %H:%M "

# pane borders
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

# messages / command prompt
set -g message-style "fg=magenta,bg=default,reverse,bold"
set -g message-command-style "fg=blue,bg=default,reverse"

# copy-mode selection + clock
set -g mode-style "fg=yellow,bg=default,reverse"
set -g clock-mode-colour "blue"

# menus (right-click menus, tmux-fzf)
set -g menu-style "fg=default,bg=default"
set -g menu-selected-style "fg=magenta,bg=default,reverse,bold"
set -g menu-border-style "fg=brightblack"
